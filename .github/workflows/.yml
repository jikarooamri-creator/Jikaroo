name: github rdp tailscale edition

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'set rdp password'
        required: true
        default: 'ataybna3na32026'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Connect to Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/tailscale-setup-full-x64.msi -o tailscale.msi
          msiexec.exe /i tailscale.msi /quiet /qn /norestart
          & "c:\program files\tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --accept-routes

      - name: configuring remote desktop
        run: |
          echo "setting up user credentials..."
          net user runneradmin "${{ github.event.inputs.password }}"
          echo "configuring registry and firewall..."
          set-itemproperty -path 'hklm:\system\currentcontrolset\control\terminal server' -name "fDenyTSConnections" -value 0
          enable-netfirewallrule -displaygroup "remote desktop"
          set-itemproperty -path 'hklm:\system\currentcontrolset\control\terminal server\winstations\rdp-tcp' -name "userauthentication" -value 1
          echo "rdp protocol enabled."

      - name: maintaining connection
        run: |
          echo "================================================"
          echo "server is live"
          echo "username: runneradmin"
          echo "password: ${{ github.event.inputs.password }}"
          echo "internal ip address:"
          & "c:\program files\tailscale\tailscale.exe" ip -4
          echo "================================================"
          while ($true) {
            echo "keep-alive: $(get-date)"
            start-sleep -seconds 300
          }
