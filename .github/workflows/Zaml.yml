name: github rdp dual tailscale

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'set rdp password'
        required: true
        default: 'AtaybNa3na3@2026!'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        instance: [server-1, server-2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download and Install Tailscale Safely
        run: |
          $installer = "$env:TEMP\tailscale-setup.msi"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.68.1-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", $installer, "/quiet", "/qn", "/norestart" -Wait

      - name: Connect to Tailscale Network
        run: |
          & "c:\program files\tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --accept-routes

      - name: configuring remote desktop stability
        run: |
          echo "disabling password complexity requirements..."
          secedit /export /cfg $env:TEMP\secpol.cfg
          (gc $env:TEMP\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0") | Out-File $env:TEMP\secpol.cfg
          (gc $env:TEMP\secpol.cfg).replace("MinimumPasswordLength = 7", "MinimumPasswordLength = 0") | Out-File $env:TEMP\secpol.cfg
          secedit /configure /db $env:windir\security\database\secpol.sdb /cfg $env:TEMP\secpol.cfg /areas SECURITYPOLICY
          echo "setting up user credentials..."
          net user runneradmin "${{ github.event.inputs.password }}"
          echo "optimizing performance and disabling timeouts..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxIdleTime" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "MaxDisconnectionTime" -Value 0

      - name: maintaining connection
        run: |
          echo "================================================"
          echo "Server Instance: ${{ matrix.instance }} is live"
          echo "username: runneradmin"
          echo "password: ${{ github.event.inputs.password }}"
          echo "internal ip address:"
          & "c:\program files\tailscale\tailscale.exe" ip -4
          echo "================================================"
          while ($true) {
            echo "keep-alive: $(get-date)"
            start-sleep -seconds 300
          }
          
